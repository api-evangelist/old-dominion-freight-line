description: >-
  Old Dominion Freight Line is a leading less-than-truckload (LTL) motor carrier providing regional, inter-regional, and
  national freight services in the United States. ODFL offers a suite of REST web services for shippers and partners to
  integrate freight booking, pickup, tracking, document retrieval, and electronic bill of lading capabilities directly
  into their systems.
apis:
- aid: old-dominion-freight-line:bill-of-lading-api
  name: ODFL Bill of Lading API
  description: >-
    Submits electronic bills of lading to the Old Dominion Freight Line billing system, generating shipping
    labels and BOL documents. Used by shippers to programmatically create freight documentation.
