description: ODFL provides REST and (legacy) SOAP web services to its existing freight customers and
  approved partners. There is no public, self-serve pricing — API access is bundled with the underlying
  ODFL freight account. Most SOAP API endpoints are scheduled to retire on December 31, 2025; customers
  are encouraged to migrate to REST. API onboarding is via api@odfl.com or 1-800-235-5569.
