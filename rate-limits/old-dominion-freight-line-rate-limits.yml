specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Old Dominion Freight Line
providerId: old-dominion-freight-line
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Freight
  - Less-Than-Truckload
  - Logistics
  - Shipping
  - Transportation
  - Rate Limiting
description: ODFL does not publish numeric rate limits on its developer/integrations page. Limits are
  applied per API key under the customer agreement and surface as 429s when crossed. Most SOAP API endpoints
  are scheduled to retire on December 31, 2025 — clients should migrate to REST.
notes: Rate limits are not publicly documented. Update once ODFL publishes per-API ceilings.
sources:
  - https://www.odfl.com/us/en/resources/shipping-api-integrations.html
responseCodes:
  unauthorized: 401
  forbidden: 403
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Per API key
    scope: api-key
    metric: varies
    limit: not numerically published; subject to fair use under the ODFL customer agreement
    applies:
      - ODFL Bill of Lading API
      - ODFL Pickup API
      - ODFL Tracking API
      - ODFL Document API
policies:
  - name: SOAP retirement
    description: 'Most SOAP API endpoints retire on December 31, 2025. Migrate to REST: BOL v3.1, Pickup
      v3.0, Tracking v2.0, Document v1.0.'
  - name: Backoff
    description: Implement exponential backoff with jitter on 429/503 responses. Honor Retry-After if
      present.
  - name: Onboarding-issued credentials
    description: API keys are provisioned through ODFL Customer Service (api@odfl.com / 1-800-235-5569)
      and scoped to the customer's account.
  - name: Polling cadence
    description: For shipment tracking, batch tracking-number lookups and avoid sub-minute polling per
      shipment to stay well within fair use.
maintainers:
  - FN: API Evangelist
    email: info@apievangelist.com
