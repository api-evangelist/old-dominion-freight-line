created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Freight
  - Less-Than-Truckload
  - Logistics
  - Shipping
  - Transportation
  - FinOps
  - Cost Management
  - FOCUS
description: 'FOCUS-aligned FinOps for ODFL: API access is bundled with the freight customer relationship
  and is not invoiced separately. Cost dimensions are operational — engineering integration time, polling
  cadence, and the SOAP-to-REST migration cost (SOAP retiring 2025-12-31).'
notes: ODFL does not invoice API consumers separately from freight services.
sources:
  - https://www.odfl.com/us/en/resources/shipping-api-integrations.html
principles:
  - name: Visibility
    description: ODFL does not bill per-call. Track per-API-key request volume and tracking-poll rate
      internally to ensure the integration scales with shipment volume.
  - name: Allocation
    description: Allocate engineering integration cost to the consuming TMS/WMS/logistics product. Tag
      ODFL API keys per app/business unit for usage attribution.
  - name: Optimization
    description: Migrate from retiring SOAP services to REST before 2025-12-31. Cache tracking responses;
      batch tracking-number lookups; avoid high-frequency polling for in-transit shipments.
  - name: Accountability
    description: Designate a logistics-IT owner for the ODFL API credential and SOAP-to-REST migration.
      Reconcile shipment-document quality with ODFL Customer Service quarterly.
billingModel:
  pricingCategory: Bundled with Freight Relationship
  billingFrequency: None (bundled)
  billingCurrency: USD
  chargeCategories:
    - Usage
  chargeFrequency: None
focusColumns:
  ServiceName: Old Dominion Freight Line API
  ServiceCategory: LTL Freight / Logistics
  ProviderName: Old Dominion Freight Line
  PublisherName: Old Dominion Freight Line, Inc.
  InvoiceIssuerName: Old Dominion Freight Line, Inc. (freight invoice; API not separately billed)
  PricingCategory: Bundled
  PricingUnit: request
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: api_requests
    description: Operationally tracked API request count per key (not invoiced)
    unit: request
    aggregation: sum
    dimensions:
      - api
      - api_key
      - endpoint
  - name: bol_submissions
    description: Bills of lading submitted via the BOL API
    unit: bol
    aggregation: sum
  - name: pickup_requests
    description: Pickup requests submitted
    unit: pickup
    aggregation: sum
  - name: tracking_polls
    description: Tracking polls (track to optimize cadence)
    unit: poll
    aggregation: sum
    dimensions:
      - shipment_id
  - name: documents_retrieved
    description: Freight documents retrieved
    unit: document
    aggregation: sum
apis:
  - name: ODFL Bill of Lading API
    baseURL: https://www.odfl.com
    tags:
      - Bill of Lading
      - Documents
      - Freight
    serviceName: ODFL Bill of Lading API
    serviceCategory: LTL Freight
  - name: ODFL Pickup API
    baseURL: https://www.odfl.com
    tags:
      - Freight
      - Pickup
    serviceName: ODFL Pickup API
    serviceCategory: LTL Freight
  - name: ODFL Tracking API
    baseURL: https://www.odfl.com
    tags:
      - Freight
      - Tracking
    serviceName: ODFL Tracking API
    serviceCategory: LTL Freight
  - name: ODFL Document API
    baseURL: https://www.odfl.com
    tags:
      - Documents
      - Freight
    serviceName: ODFL Document API
    serviceCategory: LTL Freight
unitEconomics:
  - name: Polls per shipment
    metric: tracking_polls / active_shipments
    target: minimize via reduced polling cadence
  - name: Integration cost per shipment
    metric: integration_engineering_cost / shipments_processed
    target: declining over time via reuse
