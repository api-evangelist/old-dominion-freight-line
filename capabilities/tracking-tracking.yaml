naftiko: 1.0.0-alpha2
info:
  label: ODFL Tracking API — Tracking
  description: 'ODFL Tracking API — Tracking. 1 operations. Lead operation: Get shipment tracking by PRO number. Self-contained
    Naftiko capability covering one Old Dominion Freight Line business surface.'
  tags:
  - Old Dominion Freight Line
  - Tracking
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OLD_DOMINION_FREIGHT_LINE_API_KEY: OLD_DOMINION_FREIGHT_LINE_API_KEY
capability:
  consumes:
  - type: http
    namespace: tracking-tracking
    baseUri: https://www.odfl.com/wsTracking/v2
    description: ODFL Tracking API — Tracking business capability. Self-contained, no shared references.
    resources:
    - name: tracking-proNumber
      path: /tracking/{proNumber}
      operations:
      - name: gettrackingbypro
        method: GET
        description: Get shipment tracking by PRO number
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: proNumber
          in: path
          type: string
          description: ODFL PRO number identifying the shipment.
          required: true
    authentication:
      type: basic
      username: '{{env.OLD_DOMINION_FREIGHT_LINE_USER}}'
      password: '{{env.OLD_DOMINION_FREIGHT_LINE_PASS}}'
  exposes:
  - type: rest
    namespace: tracking-tracking-rest
    port: 8080
    description: REST adapter for ODFL Tracking API — Tracking. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/tracking/{pronumber}
      name: tracking-pronumber
      description: REST surface for tracking-proNumber.
      operations:
      - method: GET
        name: gettrackingbypro
        description: Get shipment tracking by PRO number
        call: tracking-tracking.gettrackingbypro
        with:
          proNumber: rest.proNumber
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: tracking-tracking-mcp
    port: 9090
    transport: http
    description: MCP adapter for ODFL Tracking API — Tracking. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-shipment-tracking-pro-number
      description: Get shipment tracking by PRO number
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: tracking-tracking.gettrackingbypro
      with:
        proNumber: tools.proNumber
      outputParameters:
      - type: object
        mapping: $.
