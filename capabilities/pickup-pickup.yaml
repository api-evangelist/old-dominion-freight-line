naftiko: 1.0.0-alpha2
info:
  label: ODFL Pickup API — Pickup
  description: 'ODFL Pickup API — Pickup. 1 operations. Lead operation: Create a pickup request. Self-contained Naftiko capability
    covering one Old Dominion Freight Line business surface.'
  tags:
  - Old Dominion Freight Line
  - Pickup
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    OLD_DOMINION_FREIGHT_LINE_API_KEY: OLD_DOMINION_FREIGHT_LINE_API_KEY
capability:
  consumes:
  - type: http
    namespace: pickup-pickup
    baseUri: https://www.odfl.com/wsPickup/v3
    description: ODFL Pickup API — Pickup business capability. Self-contained, no shared references.
    resources:
    - name: createPickup
      path: /createPickup
      operations:
      - name: createpickup
        method: POST
        description: Create a pickup request
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: basic
      username: '{{env.OLD_DOMINION_FREIGHT_LINE_USER}}'
      password: '{{env.OLD_DOMINION_FREIGHT_LINE_PASS}}'
  exposes:
  - type: rest
    namespace: pickup-pickup-rest
    port: 8080
    description: REST adapter for ODFL Pickup API — Pickup. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/createpickup
      name: createpickup
      description: REST surface for createPickup.
      operations:
      - method: POST
        name: createpickup
        description: Create a pickup request
        call: pickup-pickup.createpickup
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: pickup-pickup-mcp
    port: 9090
    transport: http
    description: MCP adapter for ODFL Pickup API — Pickup. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: create-pickup-request
      description: Create a pickup request
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: pickup-pickup.createpickup
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
